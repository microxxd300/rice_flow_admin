server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Django: API, Django admin, and its static files (served by WhiteNoise)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Vite's hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: unknown paths load index.html so client-side routes work on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
